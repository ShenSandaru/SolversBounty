  "@prisma/engines": true
  "@scarf/scarf": false
  prisma: true
minimumReleaseAgeExclude:
  - '@nestjs/cli@12.0.12'
  - '@nestjs/common@12.4.0'
  - '@nestjs/config@12.1.1'
  - '@nestjs/core@12.4.0'
  - '@nestjs/platform-express@12.4.0'
  - '@nestjs/schematics@12.0.13'
  - '@nestjs/swagger@12.1.1'
  - '@nestjs/testing@12.4.0'
  - '@solana/web3.js@3.2.0'
  - '@tanstack/query-core@5.107.1'
  - '@tanstack/react-query@5.107.1'
